  const avgs=allScores.map(s=>Math.round(s.score/s.total_questions*100));
  const avg=Math.round(avgs.reduce((a,b)=>a+b,0)/avgs.length);
  const trend=avgs.length>=3?avgs[avgs.length-1]-avgs[avgs.length-3]:null;
  if(trend!==null&&trend>=10)recs.push({i:'🎉',t:'good',m:'הציון שלך עלה ב-'+trend+'% ב-3 הסטים האחרונים — כך ממשיכים!'});
  else if(trend!==null&&trend<=-10)recs.push({i:'⚠️',t:'warn',m:'הציון ירד ב-'+Math.abs(trend)+'% לאחרונה — כדאי לחזור על החומר.'});
  const reading=allAnswers.filter(isReadingQ),rest=allAnswers.filter(a=>!isReadingQ(a));
  let comps=[],rests=[];rest.forEach(a=>{try{const o=a.options_json?JSON.parse(a.options_json):null;if(o&&o[0]&&o[0].length<30)comps.push(a);else rests.push(a);}catch(e){comps.push(a);}});
  const weak=[];
  if(pct(comps)!==null&&pct(comps)<60)weak.push('השלמת משפטים ('+pct(comps)+'%)');
  if(pct(rests)!==null&&pct(rests)<60)weak.push('ניסוח מחדש ('+pct(rests)+'%)');
  if(pct(reading)!==null&&pct(reading)<60)weak.push('הבנת הנקרא ('+pct(reading)+'%)');
  if(weak.length)recs.push({i:'📌',t:'warn',m:'נקודות לשיפור: '+weak.join(', ')});
  const knownCnt=vocabData.filter(v=>v.status==='known').length;
  if(knownCnt<50)recs.push({i:'📖',t:'info',m:'למדת '+knownCnt+' מילים. מומלץ לתרגל את אוצר המילים יומיומית.'});
  if(avg>=90)recs.push({i:'🏆',t:'good',m:'ציון ממוצע '+avg+'% — ביצועים מצוינים!'});
  else if(avg<60)recs.push({i:'💡',t:'info',m:'ציון ממוצע '+avg+'%. עם תרגול עקבי הציון עולה. נסה סט אחד כל יום.'});
  const last=allScores.length?new Date(allScores[allScores.length-1].completed_at):null;
  if(last){const d=Math.floor((Date.now()-last)/86400000);if(d>=7)recs.push({i:'⏰',t:'warn',m:'לא תרגלת כבר '+d+' ימים. חזרה לשגרה תעשה טוב לציון!'});}
  if(!recs.length)recs.push({i:'👍',t:'good',m:'המשך לתרגל — כל סט שאתה עושה משפר את הסיכויים שלך!'});
  el.innerHTML=recs.map(r=>'<div class="rec-item"><span class="rec-icon '+r.t+'">'+r.i+'</span><span>'+r.m+'</span></div>').join('');
}
function renderHistory(){
  const el=document.getElementById('history-body');
  if(!allScores.length){el.innerHTML='<div class="empty-state">עדיין לא השלמת סטים. התחל לתרגל!</div>';return;}
  const sets=[...new Set(allAnswers.map(a=>String(a.set_number)))];
  const info=allAnswers.length===0
    ?'<div style="font-size:12px;color:#dc2626;background:#fee2e2;border-radius:8px;padding:8px 12px;margin-bottom:12px">⚠️ לא נטענו פירוטי תשובות</div>'
    :'<div style="font-size:12px;color:#059669;background:#d1fae5;border-radius:8px;padding:8px 12px;margin-bottom:12px">✓ נטענו '+allAnswers.length+' תשובות</div>';
  el.innerHTML=info+[...allScores].reverse().map(sc=>{
    const p=Math.round(sc.score/sc.total_questions*100);
    const c=p>=75?'#059669':p>=50?'#d97706':'#dc2626';
    const date=sc.completed_at?new Date(sc.completed_at).toLocaleDateString('he-IL'):'';
    const label=sc.set_number>=101?'מבחן מדומה '+(sc.set_number-100):'סט '+sc.set_number;
    const badge=sc.set_number>=101?'M'+(sc.set_number-100):sc.set_number;
    const ans=allAnswers.filter(a=>String(a.set_number)===String(sc.set_number));
    return '<div class="history-set"><div class="history-set-header" onclick="this.nextElementSibling.classList.toggle(\'open\')"><div class="hs-left"><div class="hs-badge">'+badge+'</div><div><div class="hs-name">'+label+'</div><div class="hs-date">'+date+'</div></div></div><div class="hs-score" style="color:'+c+'">'+p+'%</div></div><div class="hs-body">'+buildAnswers(ans)+'</div></div>';
  }).join('');
}
function buildAnswers(answers){
  if(!answers.length)return '<div class="empty-state">אין פירוט שאלות לסט זה</div>';
  var last=null;
  return answers.map(function(a,i){
    var ok=a.is_correct,skip=a.student_answer===-1;
    var cc=ok?'correct-card':skip?'skipped-card':'wrong-card';
    var sc=ok?'correct':skip?'skipped':'wrong';
    var st=ok?'✓ נכון':skip?'— דולג':'✗ שגוי';
    var ph='';
    var pt=a.passage_text||null;
    if(!pt&&typeof Q_PASSAGE_MAP!=='undefined'&&Q_PASSAGE_MAP[a.question_text]){
      var pid=Q_PASSAGE_MAP[a.question_text];
      if(typeof PASSAGE_BANK_LOOKUP!=='undefined'&&PASSAGE_BANK_LOOKUP[pid])pt=PASSAGE_BANK_LOOKUP[pid];
    }
    if(pt&&pt!==last){
      last=pt;
      var phtml=pt.split('|||').map(function(p){return '<p style="margin-bottom:8px">'+p+'</p>';}).join('');
      ph='<button class="passage-toggle" onclick="var b=this.nextElementSibling;b.classList.toggle(\'open\');this.querySelector(\'.arr\').textContent=b.classList.contains(\'open\')?\'▲\':\'▼\'"><span>📖 קטע הקריאה</span><span class="arr">▼</span></button><div class="passage-body">'+phtml+'</div>';
    }
    var oh='';
    try{
      var opts=a.options_json?JSON.parse(a.options_json):null;
      if(opts&&opts.length===4){
        oh='<div class="answer-options">'+opts.map(function(opt,oi){
          var is=oi===a.student_answer,ic=oi===a.correct_answer;
          var cl='answer-option',icon=(oi+1)+'.';
          if(ic&&is){cl+=' opt-correct';icon='✓';}else if(ic){cl+=' opt-correct';icon='✓';}else if(is){cl+=' opt-wrong';icon='✗';}
          return '<div class="'+cl+'"><span class="opt-icon">'+icon+'</span><span>'+opt+'</span></div>';
        }).join('')+'</div>';
      }else{
        var ct=a.correct_answer_text||'',st2=a.student_answer_text||'';
        if(!ok&&!skip)oh='<div class="answer-options">'+(st2?'<div class="answer-option opt-wrong"><span class="opt-icon">✗</span><span>'+st2+'</span></div>':'')+(ct?'<div class="answer-option opt-correct"><span class="opt-icon">✓</span><span>'+ct+'</span></div>':'')+'</div>';
        else if(ok&&ct)oh='<div class="answer-options"><div class="answer-option opt-correct"><span class="opt-icon">✓</span><span>'+ct+'</span></div></div>';
      }
    }catch(e){}
    return ph+'<div class="answer-card '+cc+'"><div class="ac-header"><span class="ac-qnum">שאלה '+(i+1)+'</span><span class="ac-status '+sc+'">'+st+'</span></div><div class="ac-qtext">'+(a.question_text||'')+'</div>'+oh+'</div>';
  }).join('');
}
function renderVocab(){
  _vocabKnown=vocabData.filter(v=>v.status==='known');
  _vocabFamiliar=vocabData.filter(v=>v.status==='familiar');
  _vocabUnknown=vocabData.filter(v=>v.status==='unfamiliar');
  document.getElementById('v-known').textContent=_vocabKnown.length;
  document.getElementById('v-familiar').textContent=_vocabFamiliar.length;
  document.getElementById('v-unknown').textContent=_vocabUnknown.length;
  setVocabFilter('known');
}
function setVocabFilter(s){
  var borders={known:'#059669',familiar:'#d97706',unfamiliar:'#dc2626'};
  var ids={known:'vf-known',familiar:'vf-familiar',unfamiliar:'vf-unknown'};
  ['known','familiar','unfamiliar'].forEach(function(k){var el=document.getElementById(ids[k]);if(el)el.style.borderColor=k===s?borders[k]:'transparent';});
  var map={known:_vocabKnown,familiar:_vocabFamiliar,unfamiliar:_vocabUnknown};
  var cls={known:'wp-known',familiar:'wp-familiar',unfamiliar:'wp-familiar'};
  var lbl={known:'שולט',familiar:'מתרגל',unfamiliar:'לא יודע'};
  var arr=map[s]||[];
  document.getElementById('vocab-card-title').textContent='מילים — '+lbl[s]+' ('+arr.length+')';
  var wl=document.getElementById('known-words-list');
  if(!arr.length){wl.innerHTML='<div class="empty-state">אין מילים בקטגוריה זו עדיין</div>';return;}
  wl.innerHTML=arr.slice(0,120).map(function(v){var w=typeof WORD_LOOKUP!=='undefined'?WORD_LOOKUP[v.word_id]||v.word_id:v.word_id;return '<span class="word-pill '+cls[s]+'">'+w+'</span>';}).join('')+(arr.length>120?'<span style="font-size:12px;color:#94a3b8"> +'+(arr.length-120)+' נוספות</span>':'');
}
function renderLessons(){
  var el=document.getElementById('lessons-body');
  el.innerHTML=LESSONS.map(function(l){
    var w=watchedData.find(function(x){return x.lesson_id===l.id;});
    return '<div class="lesson-row"><div class="lesson-watch-icon '+(w?'watched':'unwatched')+'">'+(w?'✓':'🎬')+'</div><div class="lesson-info"><div class="lesson-title-s">'+l.title+'</div><div class="lesson-meta-s">'+l.meta+'</div></div><button class="btn-watch '+(w?'done':'')+'" onclick="markWatched(\''+l.id+'\',this)" '+(w?'disabled':'')+'>'+( w?'נצפה ✓':'סמן כנצפה')+'</button></div>';
  }).join('');
}
async function markWatched(id,btn){
  if(!currentUser)return;
  if(watchedData.find(function(w){return w.lesson_id===id;}))return;
  var{error}=await sb.from('watched_lessons').insert({user_id:currentUser.id,lesson_id:id});
  if(!error){watchedData.push({lesson_id:id});btn.textContent='נצפה ✓';btn.classList.add('done');btn.disabled=true;btn.previousElementSibling.className='lesson-watch-icon watched';btn.previousElementSibling.textContent='✓';}
}
function switchTab(id,btn){
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('tab-'+id).classList.add('active');btn.classList.add('active');
}
init();
</script>
