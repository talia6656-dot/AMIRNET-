<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmirNET Pro — אזור אישי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0a1628;--navy-mid:#152340;--blue:#1a56db;--blue-light:#3b82f6;--accent:#f59e0b;--green:#059669;--green-light:#d1fae5;--red:#dc2626;--white:#fff;--gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-400:#94a3b8;--gray-600:#475569;--gray-700:#334155;--text:#0f172a;--radius:12px;--radius-lg:18px;}
body{font-family:'Heebo',sans-serif;background:var(--gray-50);color:var(--text);min-height:100vh;direction:rtl;}
#auth-guard{position:fixed;inset:0;background:var(--navy);z-index:999;display:flex;align-items:center;justify-content:center;}
#auth-guard.hidden{display:none;}
.guard-logo{font-family:'DM Serif Display',serif;font-size:2rem;color:#fff;text-align:center;}
.guard-logo span{color:var(--accent);}
.guard-sub{color:var(--gray-400);font-size:13px;margin-top:8px;text-align:center;}
.header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-mid) 100%);height:60px;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,0.2);}
.logo{font-family:'DM Serif Display',serif;font-size:1.4rem;color:#fff;}
.logo span{color:var(--accent);}
.header-right{display:flex;align-items:center;gap:12px;}
.student-name{font-size:13px;color:rgba(255,255,255,0.7);font-weight:500;}
.btn-back{background:none;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);padding:6px 14px;border-radius:8px;font-family:'Heebo',sans-serif;font-size:13px;cursor:pointer;text-decoration:none;}
.tabs-bar{background:var(--white);border-bottom:1px solid var(--gray-200);padding:0 1.5rem;display:flex;overflow-x:auto;}
.tab-btn{padding:14px 20px;font-family:'Heebo',sans-serif;font-size:14px;font-weight:500;color:var(--gray-400);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}
.main{max-width:1100px;margin:0 auto;padding:2rem 1.5rem 4rem;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:1.75rem;}
.stat-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:1.25rem;text-align:center;}
.stat-card .sv{font-size:2rem;font-weight:800;line-height:1;}
.stat-card .sl{font-size:12px;color:var(--gray-400);margin-top:4px;}
.stat-card.blue .sv{color:var(--blue);}
.stat-card.green .sv{color:var(--green);}
.stat-card.accent .sv{color:var(--accent);}
.stat-card.purple .sv{color:#7c3aed;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:1.75rem;}
.card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:1.5rem;}
.card-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:1.25rem;}
.chart-wrap{width:100%;height:160px;}
.chart-empty{display:flex;align-items:center;justify-content:center;height:160px;color:var(--gray-400);font-size:13px;}
.section-bar{margin-bottom:14px;}
.sb-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
.sb-track{background:var(--gray-100);border-radius:999px;height:10px;overflow:hidden;}
.sb-fill{height:100%;border-radius:999px;}
.rec-card{background:linear-gradient(135deg,#eff6ff 0%,#f0fdf4 100%);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1.75rem;}
.rec-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:1rem;}
.rec-item{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;font-size:13.5px;color:var(--gray-700);line-height:1.55;}
.rec-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:1px;}
.rec-icon.good{background:#dcfce7;color:#166534;}
.rec-icon.warn{background:#fef9c3;color:#854d0e;}
.rec-icon.info{background:#dbeafe;color:#1e40af;}
.feedback-card{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:1.5rem;margin-bottom:1.75rem;}
.feedback-grade{font-size:2.5rem;font-weight:800;color:var(--blue);margin-bottom:6px;}
.feedback-note{font-size:14px;color:var(--gray-700);line-height:1.6;white-space:pre-line;}
.feedback-date{font-size:12px;color:var(--gray-400);margin-top:8px;}
.no-feedback{color:var(--gray-400);font-size:13px;font-style:italic;}
.history-set{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
.history-set-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;}
.history-set-header:hover{background:var(--gray-50);}
.hs-left{display:flex;align-items:center;gap:12px;}
.hs-badge{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue-light));color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hs-name{font-size:14px;font-weight:600;}
.hs-date{font-size:12px;color:var(--gray-400);margin-top:1px;}
.hs-score{font-size:18px;font-weight:800;}
.hs-body{display:none;padding:0 18px 16px;border-top:1px solid var(--gray-100);}
.hs-body.open{display:block;}
.answer-card{border-radius:10px;padding:12px 14px;margin-top:10px;border:1px solid transparent;}
.correct-card{background:#f0fdf4;border-color:#86efac;}
.wrong-card{background:#fff1f2;border-color:#fca5a5;}
.skipped-card{background:var(--gray-50);border-color:var(--gray-200);}
.ac-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px;}
.ac-qnum{font-size:12px;color:var(--gray-400);}
.ac-status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;}
.ac-status.correct{background:#dcfce7;color:#166534;}
.ac-status.wrong{background:#fee2e2;color:#991b1b;}
.ac-status.skipped{background:var(--gray-200);color:var(--gray-600);}
.ac-qtext{font-size:13px;color:var(--gray-700);margin-bottom:8px;line-height:1.5;}
.answer-options{display:flex;flex-direction:column;gap:5px;}
.answer-option{display:flex;align-items:flex-start;gap:8px;padding:7px 10px;border-radius:8px;font-size:13px;background:var(--white);border:1px solid var(--gray-200);}
.opt-correct{background:#dcfce7;border-color:#86efac;color:#166534;font-weight:600;}
.opt-wrong{background:#fee2e2;border-color:#fca5a5;color:#991b1b;font-weight:600;}
.opt-icon{font-size:12px;flex-shrink:0;min-width:16px;}
.passage-toggle{width:100%;text-align:right;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:7px 12px;font-family:'Heebo',sans-serif;font-size:12px;font-weight:600;color:var(--blue);cursor:pointer;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.passage-body{display:none;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:12px 14px;margin-bottom:8px;font-size:13px;line-height:1.75;color:var(--gray-700);direction:ltr;text-align:left;}
.passage-body.open{display:block;}
.vocab-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem;}
.vocab-cat{background:var(--white);border:2px solid transparent;border-radius:var(--radius);padding:1.25rem;text-align:center;cursor:pointer;transition:border-color 0.15s;}
.vocab-cat .vc-num{font-size:2rem;font-weight:800;margin-bottom:4px;}
.vocab-cat .vc-label{font-size:12px;color:var(--gray-400);}
.vocab-cat.known .vc-num{color:var(--green);}
.vocab-cat.familiar .vc-num{color:var(--accent);}
.vocab-cat.unknown .vc-num{color:var(--red);}
.words-list{display:flex;flex-wrap:wrap;gap:6px;}
.word-pill{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;}
.wp-known{background:#dcfce7;color:#166534;}
.wp-familiar{background:#fef9c3;color:#854d0e;}
.lesson-row{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.lesson-watch-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.lesson-watch-icon.watched{background:var(--green-light);}
.lesson-watch-icon.unwatched{background:var(--gray-100);}
.lesson-info{flex:1;}
.lesson-title-s{font-size:14px;font-weight:600;}
.lesson-meta-s{font-size:12px;color:var(--gray-400);margin-top:2px;}
.btn-watch{padding:6px 14px;background:var(--blue);border:none;border-radius:8px;font-family:'Heebo',sans-serif;font-size:12px;font-weight:600;color:#fff;cursor:pointer;}
.btn-watch.done{background:var(--green);cursor:default;}
.loading-state{text-align:center;padding:3rem;color:var(--gray-400);font-size:14px;}
.empty-state{text-align:center;padding:2rem;color:var(--gray-400);font-size:13px;}
@media(max-width:640px){.stats-row{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}.vocab-cats{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div id="auth-guard"><div><div class="guard-logo">Amir<span>NET</span> Pro</div><div class="guard-sub">בודק הרשאות...</div></div></div>
<header class="header">
  <div class="logo">Amir<span>NET</span> Pro</div>
  <div class="header-right">
    <span class="student-name" id="student-name"></span>
    <a class="btn-back" href="amirnet-pro.html">← חזרה לאתר</a>
  </div>
</header>
<div class="tabs-bar">
  <button class="tab-btn active" onclick="switchTab('overview',this)">📊 סקירה כללית</button>
  <button class="tab-btn" onclick="switchTab('history',this)">📋 היסטוריה מלאה</button>
  <button class="tab-btn" onclick="switchTab('vocab',this)">📚 מילים</button>
  <button class="tab-btn" onclick="switchTab('lessons',this)">🎬 שיעורים</button>
</div>
<main class="main">
  <div class="tab-panel active" id="tab-overview">
    <div class="stats-row">
      <div class="stat-card blue"><div class="sv" id="ov-sets">—</div><div class="sl">סטים הושלמו</div></div>
      <div class="stat-card green"><div class="sv" id="ov-avg">—</div><div class="sl">ציון ממוצע</div></div>
      <div class="stat-card accent"><div class="sv" id="ov-words">—</div><div class="sl">מילים שנלמדו</div></div>
      <div class="stat-card purple"><div class="sv" id="ov-streak">—</div><div class="sl">ימים פעיל</div></div>
    </div>
    <div class="rec-card"><div class="rec-title">💡 המלצות אישיות</div><div id="rec-body"><div class="loading-state">מנתח...</div></div></div>
    <div class="grid-2">
      <div class="card"><div class="card-title">📈 מגמת ציונים</div><div id="chart-wrap" class="chart-wrap"><div class="chart-empty">אין עדיין מספיק נתונים</div></div></div>
      <div class="card"><div class="card-title">🎯 ביצועים לפי סוג שאלה</div><div id="section-bars"><div class="loading-state">טוען...</div></div></div>
    </div>
    <div class="feedback-card"><div class="card-title">💬 משוב מהמורה</div><div id="feedback-body"><div class="loading-state">טוען...</div></div></div>
  </div>
  <div class="tab-panel" id="tab-history"><div id="history-body"><div class="loading-state">טוען...</div></div></div>
  <div class="tab-panel" id="tab-vocab">
    <div class="vocab-cats">
      <div class="vocab-cat known" id="vf-known" onclick="setVocabFilter('known')"><div class="vc-num" id="v-known">—</div><div class="vc-label">✓ שולט</div></div>
      <div class="vocab-cat familiar" id="vf-familiar" onclick="setVocabFilter('familiar')"><div class="vc-num" id="v-familiar">—</div><div class="vc-label">↻ מתרגל</div></div>
      <div class="vocab-cat unknown" id="vf-unknown" onclick="setVocabFilter('unfamiliar')"><div class="vc-num" id="v-unknown">—</div><div class="vc-label">✗ לא יודע</div></div>
    </div>
    <div class="card"><div class="card-title" id="vocab-card-title">המילים שלי</div><div id="known-words-list" class="words-list"><div class="empty-state">לא סומנו מילים עדיין</div></div></div>
  </div>
  <div class="tab-panel" id="tab-lessons"><div id="lessons-body"><div class="loading-state">טוען...</div></div></div>
</main>
